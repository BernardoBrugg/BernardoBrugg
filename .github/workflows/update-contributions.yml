name: Update combined contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/update-contributions.mjs"
      - ".github/workflows/update-contributions.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate combined contribution graph
        run: node .github/scripts/update-contributions.mjs

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/combined-contributions.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update combined contribution graph"
          git push
